version: "3.8"

services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload