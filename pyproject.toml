[project]
name = "article-rag"
version = "0.1.0"
description = "RAG system for scientific articles"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "qdrant-client",
    "sentence-transformers",
    "pypdf",
    "python-multipart",
    "pydantic"
]

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"